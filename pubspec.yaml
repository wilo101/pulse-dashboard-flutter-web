name: pulse_dashboard
description: Responsive admin dashboard built with Flutter Web: orders, customers, settings, charts and a Relay REST backend.
publish_to: none
version: 2.0.0
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.69.0
  provider: ^6.1.2
  intl: ^0.19.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
